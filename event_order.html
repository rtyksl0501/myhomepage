<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 1: 스마트 피자 주문서</title>
    <style>
        /* 구글 웹폰트 적용 (Noto Sans KR) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h3 {
            font-size: 24px;
            font-weight: 700;
            color: #ff5e36;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }

        hr {
            border: 0;
            height: 2px;
            background: #ff5e36;
            opacity: 0.2;
            margin-bottom: 25px;
        }

        /* 메뉴 박스 카드 스타일 */
        #menu_box {
            background-color: #fff9f6;
            border: 1px solid #ffe5db;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        #menu_box h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #d9411e;
            font-size: 16px;
            font-weight: 700;
        }

        /* 메뉴 개별 아이템 행 */
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #ffd1c1;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* 체크박스와 라벨 정렬 */
        .menu-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            flex-grow: 1;
        }

        .menu-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: #ff5e36; /* 체크박스 포인트 컬러 */
            cursor: pointer;
        }

        /* 수량 입력창 */
        .menu-qty {
            width: 50px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .menu-qty:focus {
            border-color: #ff5e36;
        }

        .qty-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #666;
        }

        /* 하단 입력 폼 영역 */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #ff5e36;
        }

        /* 주문 합계 창 전용 */
        #total {
            background-color: #f1f3f5;
            font-weight: 700;
            font-size: 18px;
            color: #ff5e36;
            text-align: right;
            padding-right: 40px;
        }

        .total-wrapper {
            position: relative;
        }

        .total-unit {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: #ff5e36;
        }

        /* 버튼 영역 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: #ff5e36;
            color: white;
        }

        .btn-submit:hover {
            background-color: #e04b24;
        }

        .btn-reset {
            background-color: #e9ecef;
            color: #495057;
        }

        .btn-reset:hover {
            background-color: #dee2e6;
        }
    </style>
    <script>
        /* 기능 1: 가격 계산 함수 */
        function recalc() {
            var total = 0; 
            var checks = document.getElementsByClassName("menu-check");
            var qtys = document.getElementsByClassName("menu-qty");

            for (var i = 0; i < checks.length; i++) {
                if (checks[i].checked) { 
                    var price = parseInt(checks[i].value);
                    var quantity = parseInt(qtys[i].value);
                    
                    if (isNaN(quantity) || quantity < 1) {
                        quantity = 1;
                        qtys[i].value = 1;
                    }
                    total += price * quantity;
                }
            }
            document.getElementById("total").value = total.toLocaleString(); // 세자리 콤마 추가로 가독성 업!
        }

        /* 기능 2: 주소 입력 확인 */
        function checkAddress() {
            var addr = document.getElementById("addr");
            if (addr.value.trim() == "") {
                alert("배달 받으실 주소를 반드시 입력해주세요!");
                addr.focus();
                return false;
            }
            return true;
        }

        /* 기능 3: 주문 전송 제어 */
        function validate(e) {
            if (!checkAddress()) {
                e.preventDefault();
                return false;
            }

            var totalStr = document.getElementById("total").value.replace(/,/g, '');
            var total = parseInt(totalStr);
            
            if (total == 0 || isNaN(total)) {
                alert("상품을 적어도 하나는 선택해야 주문 가능합니다.");
                e.preventDefault(); 
                return false;
            }

            alert("주문이 완료되었습니다! (총 결제금액: " + total.toLocaleString() + "원)");
            e.preventDefault(); 
            return false; 
        }
    </script>
</head>
<body>
    <div class="container">
        <h3>🍕 피자 주문서</h3>
        <hr>
        
        <form action="#" onsubmit="return validate(event)">
            
            <div id="menu_box">
                <h4>[메뉴 선택]</h4>
                
                <div class="menu-item">
                    <label class="menu-label">
                        <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 콤비네이션 피자 (15,000원)
                    </label>
                    <div class="qty-wrapper">
                        <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                    </div>
                </div>
                <div class="menu-item">
                    <label class="menu-label">
                        <input type="checkbox" class="menu-check" value="12000" onchange="recalc()"> 페퍼로니 피자 (12,000원)
                    </label>
                    <div class="qty-wrapper">
                        <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                    </div>
                </div>
                <div class="menu-item">
                    <label class="menu-label">
                        <input type="checkbox" class="menu-check" value="2000" onchange="recalc()"> 치즈 토핑 추가 (2,000원)
                    </label>
                    <div class="qty-wrapper">
                        <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                    </div>
                </div>
                <div class="menu-item">
                    <label class="menu-label">
                        <input type="checkbox" class="menu-check" value="1500" onchange="recalc()"> 콜라 1.25L (1,500원)
                    </label>
                    <div class="qty-wrapper">
                        <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label Kakao="addr">📍 배달 주소</label>
                <input type="text" id="addr" class="form-control" onblur="checkAddress()" placeholder="배달 받으실 주소를 입력하세요">
            </div>

            <div class="form-group">
                <label for="total">💰 주문 합계</label>
                <div class="total-wrapper">
                    <input type="text" id="total" class="form-control" value="0" readonly>
                    <span class="total-unit">원</span>
                </div>
            </div>

            <div class="btn-group">
                <input type="reset" class="btn btn-reset" value="초기화" onclick="setTimeout(recalc, 0)">
                <input type="submit" class="btn btn-submit" value="주문하기">
            </div>
        </form>
    </div>
</body>
</html>
