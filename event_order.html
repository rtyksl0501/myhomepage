<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 5: 김태원의 스마트 피자 주문서</title>
    <style>
        /* 구글 웹폰트 적용으로 텍스트 가독성 향상 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f6f9; /* 편안하고 밝은 배경색 */
            color: #333;
        }

        /* 👤 상단 프로필 헤더 영역 (블루 그라데이션) */
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header .subtitle {
            margin: 10px 0 0 0;
            font-size: 1.05rem;
            font-weight: 400;
            color: #e0e6ed;
        }

        /* 🧭 네비게이션 바 영역 */
        nav {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            font-size: 16px;
            padding: 18px 25px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: #2a5298;
            background-color: #f7fafc;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background-color: #2a5298;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 70%;
        }

        /* 📦 중앙 주문서 컨테이너 */
        .main-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .order-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .order-card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e3c72;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        /* 메뉴 박스 영역 스타일 */
        #menu_box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 12px;
        }

        #menu_box h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #334155;
            font-size: 15px;
            font-weight: 700;
        }

        /* 각 메뉴 항목 레이아웃 */
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            flex-grow: 1;
        }

        .menu-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            accent-color: #1e3c72; /* 포트폴리오 메인 블루 컬러 매칭 */
            cursor: pointer;
        }

        /* 수량 조절 창 */
        .menu-qty {
            width: 50px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .menu-qty:focus {
            border-color: #1e3c72;
        }

        .qty-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #64748b;
        }

        /* 하단 폼 레이아웃 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #475569;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #1e3c72;
        }

        /* 주문 합계 금액 전용 */
        #total {
            background-color: #f1f5f9;
            font-weight: 700;
            font-size: 18px;
            color: #1e3c72;
            text-align: right;
            padding-right: 40px;
        }

        .total-wrapper {
            position: relative;
        }

        .total-unit {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: #1e3c72;
        }

        /* 버튼 컨테이너 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: #1e3c72;
            color: white;
        }

        .btn-submit:hover {
            background-color: #162c54;
        }

        .btn-reset {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-reset:hover {
            background-color: #cbd5e1;
        }
    </style>
    <script>
        /* 기능 1: 가격 계산 함수 */
        function recalc() {
            var total = 0; 
            var checks = document.getElementsByClassName("menu-check");
            var qtys = document.getElementsByClassName("menu-qty");

            for (var i = 0; i < checks.length; i++) {
                if (checks[i].checked) { 
                    var price = parseInt(checks[i].value);
                    var quantity = parseInt(qtys[i].value);
                    
                    if (isNaN(quantity) || quantity < 1) {
                        quantity = 1;
                        qtys[i].value = 1;
                    }
                    total += price * quantity;
                }
            }
            // 세자리 콤마 포맷 적용
            document.getElementById("total").value = total.toLocaleString();
        }

        /* 기능 2: 주소 입력 확인 */
        function checkAddress() {
            var addr = document.getElementById("addr");
            if (addr.value.trim() == "") {
                alert("배달 받으실 주소를 반드시 입력해주세요!");
                addr.focus();
                return false;
            }
            return true;
        }

        /* 기능 3: 주문 전송 제어 */
        function validate(e) {
            if (!checkAddress()) {
                e.preventDefault();
                return false;
            }

            var totalStr = document.getElementById("total").value.replace(/,/g, '');
            var total = parseInt(totalStr);
            
            if (total == 0 || isNaN(total)) {
                alert("상품을 적어도 하나는 선택해야 주문 가능합니다.");
                e.preventDefault(); 
                return false;
            }

            alert("주문이 완료되었습니다! (총 결제금액: " + total.toLocaleString() + "원)");
            e.preventDefault(); 
            return false; 
        }
    </script>
</head>
<body>

    <header>
        <h1>이름: 김태원</h1>
        <p class="subtitle">한 줄 소개: 광운대 전자공학과</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="main-container">
        <div class="order-card">
            <h2>실습 5: 스마트 피자 주문서</h2>
            
            <form action="#" onsubmit="return validate(event)">
                
                <div id="menu_box">
                    <h4>[메뉴 선택]</h4>
                    
                    <div class="menu-item">
                        <label class="menu-label">
                            <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 콤비네이션 피자 (15,000원)
                        </label>
                        <div class="qty-wrapper">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                    <div class="menu-item">
                        <label class="menu-label">
                            <input type="checkbox" class="menu-check" value="12000" onchange="recalc()"> 페퍼로니 피자 (12,000원)
                        </label>
                        <div class="qty-wrapper">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                    <div class="menu-item">
                        <label class="menu-label">
                            <input type="checkbox" class="menu-check" value="2000" onchange="recalc()"> 치즈 토핑 추가 (2,000원)
                        </label>
                        <div class="qty-wrapper">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                    <div class="menu-item">
                        <label class="menu-label">
                            <input type="checkbox" class="menu-check" value="1500" onchange="recalc()"> 콜라 1.25L (1,500원)
                        </label>
                        <div class="qty-wrapper">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="addr">📍 배달 주소</label>
                    <input type="text" id="addr" class="form-control" onblur="checkAddress()" placeholder="배달 받으실 주소를 입력하세요">
                </div>

                <div class="form-group">
                    <label for="total">💳 주문 합계</label>
                    <div class="total-wrapper">
                        <input type="text" id="total" class="form-control" value="0" readonly>
                        <span class="total-unit">원</span>
                    </div>
                </div>

                <div class="btn-group">
                    <input type="reset" class="btn btn-reset" value="초기화" onclick="setTimeout(recalc, 0)">
                    <input type="submit" class="btn btn-submit" value="주문하기">
                </div>
            </form>
        </div>
    </div>

</body>
</html>
