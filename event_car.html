<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 2: 김태원의 미니 카 드라이브</title>
    <style>
        /* 깔끔하고 모던한 구글 폰트 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Dodum&display=swap');

        body {
            height: 100vh;
            overflow: hidden; /* 브라우저 스크롤바 방지 */
            background-color: #e8f5e9; /* 싱그러운 연초록 잔디밭 배경 */
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 👤 상단 프로필 헤더 영역 */
        header {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%); /* 전자공학과의 스마트함과 잔디밭이 어우러진 그린 그라데이션 */
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }

        header .subtitle {
            margin: 8px 0 0 0;
            font-size: 1rem;
            color: #e8f5e9;
        }

        /* 🧭 네비게이션 바 영역 */
        nav {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            font-size: 15px;
            padding: 15px 25px;
            transition: all 0.2s ease;
            position: relative;
        }

        nav a:hover {
            color: #2e7d32;
            background-color: #f7fafc;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background-color: #2e7d32;
            transition: all 0.2s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 70%;
        }

        /* 🎮 실제 자동차가 움직이는 드라이브 존 */
        #game_zone {
            flex: 1; /* 헤더와 네비를 제외한 나머지 화면을 꽉 채움 */
            position: relative;
            width: 100%;
        }

        /* 🚗 파스텔 핫핑크 미니카 디자인 */
        #car {
            position: absolute; 
            left: 50px;        
            top: 50px; /* game_zone 내부에서의 상대적 좌표 */
            width: 85px; 
            height: 45px;
            background: linear-gradient(135deg, #ff80ab, #ff4081);
            border-radius: 10px;
            color: white; 
            font-weight: bold; 
            text-align: center; 
            line-height: 45px;
            font-size: 14px;
            font-family: 'Gowun Dodum', sans-serif;
            letter-spacing: 1px;
            box-shadow: 0 6px 12px rgba(255, 64, 129, 0.3);
        }

        /* 바퀴 모양 시각 효과 */
        #car::before, #car::after {
            content: '';
            position: absolute;
            bottom: -5px;
            width: 14px;
            height: 14px;
            background-color: #37474f;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        #car::before { left: 12px; }
        #car::after { right: 12px; }
        
        /* 📟 하단 화이트 톤 좌표 표시창 */
        #info {
            position: absolute;
            bottom: 20px; 
            left: 20px;
            padding: 10px 20px; 
            background: rgba(255, 255, 255, 0.9); 
            color: #2e7d32;
            font-weight: bold;
            border-radius: 30px;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #c8e6c9;
            pointer-events: none; /* 마우스 클릭 방해 금지 */
        }
    </style>
    <script>
        // 초기 맵 안에서의 자동차 좌표
        var x = 50;
        var y = 50; 
        var step = 15; // 이동 거리

        window.onload = function() {
            var car = document.getElementById("car");
            var info = document.getElementById("info");
            var gameZone = document.getElementById("game_zone");

            document.onkeydown = function(e) {
                // 방향키 입력 시 브라우저 스크롤 방지
                if([37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                    e.preventDefault();
                }

                // 자동차가 움직일 수 있는 드라이브 존의 실제 현재 크기 계산
                var zoneWidth = gameZone.clientWidth;
                var zoneHeight = gameZone.clientHeight;
                var carWidth = car.offsetWidth;
                var carHeight = car.offsetHeight;

                switch(e.keyCode) {
                    case 37: // [왼쪽]
                        x -= step;
                        if (x < 0) x = 0;
                        break;
                    case 38: // [위쪽]
                        y -= step;
                        if (y < 0) y = 0; // 상단 메뉴바를 침범하지 못하도록 0에서 락
                        break;
                    case 39: // [오른쪽]
                        x += step;
                        var maxLeft = zoneWidth - carWidth;
                        if (x > maxLeft) x = maxLeft;
                        break;
                    case 40: // [아래쪽]
                        y += step;
                        var maxTop = zoneHeight - carHeight;
                        if (y > maxTop) y = maxTop;
                        break;
                }

                // 위치 업데이트
                car.style.left = x + "px";
                car.style.top = y + "px";

                // 정보 표시
                info.innerHTML = "현재 위치 (x, y) = (" + x + ", " + y + ")";
            }
        }
    </script>
</head>
<body>

    <header>
        <h1>이름: 김태원</h1>
        <p class="subtitle">한 줄 소개: 광운대 전자공학과</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div id="game_zone">
        <div id="car">CAR</div>
        <div id="info">현재 위치 (x, y) = (50, 50)</div>
    </div>

</body>
</html>
